[project]
name = "hoso-ai-worker"
version = "0.1.0"
description = "Worker AI cục bộ cho Hồ sơ số: đọc PDF, OCR, gợi ý phân loại và trường. Không gọi dịch vụ cloud."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pypdfium2==5.15.2",
  "pillow>=11",
]

[project.optional-dependencies]
# Mac Apple Silicon: giữ đúng phiên bản đã kiểm thử trong document_ai/requirements.lock.txt
mlx = [
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.3.1",
  "mlx-vlm==0.7.12",
  "mlx-lm==0.32.2",
]
dev = ["pytest>=8"]

[project.scripts]
hoso-ai = "hoso_ai.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
